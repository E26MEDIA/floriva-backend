<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Floriva SEO CMS</title>
  <link rel="stylesheet" href="/seo-cms/styles.css" />
</head>
<body>
  <div id="login-view" class="auth">
    <form id="login-form" class="card auth-card" action="/api/admin/login" method="post" accept-charset="UTF-8">
      <p class="eyebrow">Floriva Gifts</p>
      <h1>SEO &amp; Blog CMS</h1>
      <p class="muted">Sign in with the same username and password you use at admin.florivagifts.com.</p>
      <label>Username <input name="username" id="username" autocomplete="username" required /></label>
      <label>Password <input name="password" id="password" type="password" autocomplete="current-password" required /></label>
      <button type="submit" id="login-submit">Sign in</button>
      <p id="login-error" class="error"></p>
    </form>
  </div>

  <div id="app-view" hidden>
    <header class="top">
      <div>
        <p class="eyebrow">Floriva Gifts</p>
        <h1>SEO &amp; Blog CMS</h1>
      </div>
      <button id="logout" type="button" class="ghost">Sign out</button>
    </header>
    <nav class="tabs">
      <button data-tab="pages" class="active">Pages</button>
      <button data-tab="blog">Blog</button>
      <button data-tab="products">Products</button>
      <button data-tab="redirects">Redirects</button>
      <button data-tab="technical">Technical SEO</button>
      <button data-tab="google">Google tools</button>
    </nav>
    <p id="flash" class="flash" hidden></p>
    <main id="panel"></main>
  </div>
  <script src="/seo-cms/app.js?v=7"></script>
</body>
</html>
