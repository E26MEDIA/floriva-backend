<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Floriva SEO CMS sign in</title>
  <style>
    body { margin:0; font-family:Arial,Helvetica,sans-serif; background:#f7f3ee; color:#1e1610; }
    .auth { min-height:100vh; display:grid; place-items:center; padding:24px; }
    .card { background:#fff; border:1px solid #eadfd4; border-radius:18px; padding:28px; width:min(420px,100%); }
    .eyebrow { margin:0 0 6px; color:#b5623b; font-size:12px; letter-spacing:.08em; text-transform:uppercase; font-weight:700; }
    h1 { margin:0 0 8px; font-size:26px; }
    p { color:#6b5c51; font-size:14px; line-height:1.5; }
    label { display:block; margin:14px 0; font-weight:700; font-size:13px; }
    input { width:100%; margin-top:6px; padding:10px 12px; border:1px solid #eadfd4; border-radius:10px; font:inherit; box-sizing:border-box; }
    button { background:#b5623b; color:#fff; border:0; border-radius:10px; padding:10px 16px; font-weight:700; cursor:pointer; }
    .error { color:#b42318; }
  </style>
</head>
<body>
  <div class="auth">
    <form class="card" action="/api/admin/login" method="post" accept-charset="UTF-8">
      <p class="eyebrow">Floriva Gifts</p>
      <h1>SEO CMS sign in</h1>
      <p>Use the same username and password as admin.florivagifts.com. This page does not use JavaScript.</p>
      <label>Username <input name="username" autocomplete="username" required /></label>
      <label>Password <input name="password" type="password" autocomplete="current-password" required /></label>
      <button type="submit">Sign in</button>
      <p class="error" id="err"></p>
    </form>
  </div>
  <script>
    var err = new URLSearchParams(location.search).get('error');
    if (err) document.getElementById('err').textContent = err;
  </script>
</body>
</html>
